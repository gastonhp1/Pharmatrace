name: Fabric

on:
  pull_request:
    paths: ["fabric/**", ".github/workflows/fabric.yml"]
  push:
    branches: [main]
    paths: ["fabric/**", ".github/workflows/fabric.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaincode:
    name: Chaincode (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        # Everything a step prints also goes to a log, so a failure can be shown as an
        # annotation on the PR (see the last step of each job).
        shell: bash --noprofile --norc -o pipefail -c 'bash -e {0} 2>&1 | tee -a "$RUNNER_TEMP/job.log"'
        working-directory: fabric/chaincode/pharmatrace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: fabric/chaincode/pharmatrace/go.mod
          cache-dependency-path: fabric/chaincode/pharmatrace/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Show the failure on the PR
        if: failure()
        shell: bash
        run: |
          tail -n 60 "$RUNNER_TEMP/job.log" | python3 -c 'import sys; m = sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Last lines of the log::" + m)'

  network:
    name: Network (4 orgs + Raft, end to end)
    needs: chaincode
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        # Everything a step prints also goes to a log, so a failure can be shown as an
        # annotation on the PR (see the last step of each job).
        shell: bash --noprofile --norc -o pipefail -c 'bash -e {0} 2>&1 | tee -a "$RUNNER_TEMP/job.log"'
        working-directory: fabric/network
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x network.sh scripts/*.sh
      - run: ./network.sh prereq
      - run: ./network.sh up
      - run: ./network.sh channel
      - run: ./network.sh deploy
      - run: ./network.sh smoke
      # Deploying again must upgrade in place (sequence 2) and keep the data.
      - run: CC_VERSION=0.2 ./network.sh deploy && ./network.sh smoke
      - name: Show the failure on the PR
        if: failure()
        shell: bash
        run: |
          annotate() { python3 -c 'import sys; t, m = sys.argv[1], sys.stdin.read(); print("::%s title=%s::%s" % (sys.argv[2], t, m.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))' "$1" "$2"; }
          tail -n 60 "$RUNNER_TEMP/job.log" | annotate "Last lines of the log" error
          for c in $(docker ps -a --format '{{.Names}}' | grep -v _pharmatrace | head -8); do
            docker logs --tail 25 "$c" 2>&1 | annotate "$c" warning
          done
          docker logs --tail 25 peer0dist_pharmatrace 2>&1 | annotate peer0dist_pharmatrace warning || true
      - if: always()
        run: ./network.sh down
