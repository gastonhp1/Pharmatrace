name: Fabric

on:
  pull_request:
    paths: ["fabric/**", "backend/**", "iot/**", ".github/workflows/fabric.yml"]
  push:
    branches: [main]
    paths: ["fabric/**", "backend/**", "iot/**", ".github/workflows/fabric.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaincode:
    name: Chaincode (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric/chaincode/pharmatrace
    steps:
      - uses: actions/checkout@v4
      # Every later step also writes its output to a log (bash sources BASH_ENV), so a failure
      # can be shown as an annotation on the PR (see the last steps of the job).
      - name: Keep a log for the PR annotations
        working-directory: .
        run: |
          echo '[ -n "${JOB_LOG_TEE:-}" ] || { export JOB_LOG_TEE=1; exec > >(tee -a "$RUNNER_TEMP/job.log") 2>&1; }' > "$RUNNER_TEMP/tee.sh"
          echo "BASH_ENV=$RUNNER_TEMP/tee.sh" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version-file: fabric/chaincode/pharmatrace/go.mod
          cache-dependency-path: fabric/chaincode/pharmatrace/go.sum
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -cover ./...
      - name: Show the failure on the PR
        if: failure()
        env: { BASH_ENV: "" }
        run: |
          tail -n 60 "$RUNNER_TEMP/job.log" 2>/dev/null | python3 -c 'import sys; m = sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error title=Last lines of the log::" + m)'

  network:
    name: Network + API (4 orgs + Raft, end to end)
    needs: chaincode
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: fabric/network
    steps:
      - uses: actions/checkout@v4
      # Every later step also writes its output to a log (bash sources BASH_ENV), so a failure
      # can be shown as an annotation on the PR (see the last steps of the job).
      - name: Keep a log for the PR annotations
        working-directory: .
        run: |
          echo '[ -n "${JOB_LOG_TEE:-}" ] || { export JOB_LOG_TEE=1; exec > >(tee -a "$RUNNER_TEMP/job.log") 2>&1; }' > "$RUNNER_TEMP/tee.sh"
          echo "BASH_ENV=$RUNNER_TEMP/tee.sh" >> "$GITHUB_ENV"
      - run: shellcheck -x network.sh scripts/*.sh
      - run: ./network.sh prereq
      - run: ./network.sh up
      - run: ./network.sh channel
      - run: ./network.sh deploy
      - run: ./network.sh smoke
      # The REST API against the same network, with the valija simulator uploading signed readings.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the API and the simulator
        working-directory: .
        run: |
          npm ci --prefix backend
          pip install -r iot/simulator/requirements.txt
      - run: ./network.sh api
      # Deploying again must upgrade in place (sequence 2) and keep the data.
      - run: CC_VERSION=0.2 ./network.sh deploy && ./network.sh smoke
      # The PKI runbook: renew a peer, rotate an orderer's TLS certificate, revoke a gateway.
      # Last, because it revokes the gateway the other tests use.
      - run: bash scripts/pki-test.sh
      - name: Show the failure on the PR
        if: failure()
        env: { BASH_ENV: "" }
        run: |
          annotate() { python3 -c 'import sys; t, m = sys.argv[1], sys.stdin.read(); print("::%s title=%s::%s" % (sys.argv[2], t, m.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))' "$1" "$2"; }
          tail -n 60 "$RUNNER_TEMP/job.log" 2>/dev/null | annotate "Last lines of the log" error
          for c in $(docker ps -a --format '{{.Names}}' | grep -v _pharmatrace | head -8); do
            docker logs --tail 25 "$c" 2>&1 | annotate "$c" warning
          done
          docker logs --tail 25 peer0dist_pharmatrace 2>&1 | annotate peer0dist_pharmatrace warning || true
      - if: always()
        run: ./network.sh down
