name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  simulator:
    name: IoT simulator (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r iot/simulator/requirements.txt
      - run: python -m unittest discover -s iot/simulator

  # Image: built, scanned (Trivy gate), pushed to GHCR and signed by the
  # golden-path reusable workflow, the only signing identity the platform's
  # Kyverno policy trusts. PRs build + scan only; main pushes and signs.
  image-api:
    name: Image (API)
    needs: backend
    uses: gastonhp1/secure-cicd-golden-path/.github/workflows/reusable-container.yml@main
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    with:
      image-name: pharmatrace-api
      context: .
      file: backend/Dockerfile
      push: ${{ github.event_name != 'pull_request' }}
      platforms: linux/amd64

  # Pin the signed digest in the GitOps repo: the golden-path promote job
  # verifies the signature and opens an auto-merge PR.
  promote-api:
    name: Promote (API) → local
    if: github.ref == 'refs/heads/main'
    needs: image-api
    uses: gastonhp1/secure-cicd-golden-path/.github/workflows/reusable-gitops-promote.yml@main
    permissions:
      contents: read
      id-token: write
      packages: read
    with:
      environment: local
      image: ${{ needs.image-api.outputs.image }}
      digest: ${{ needs.image-api.outputs.digest }}
      version: ${{ needs.image-api.outputs.version }}
      values-files: gitops/apps/pharmatrace/values-local.yaml
      image-path: .images.backend
      auto-merge: true
    secrets:
      GITOPS_APP_ID: ${{ secrets.GITOPS_APP_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
